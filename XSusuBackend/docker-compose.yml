version: '3.8'

services:
  # Production Database
  postgres-prod:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xsusu_prod
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
      POSTGRES_DB: xsusu
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - xsusu-prod

  # Staging Database (separate from production)
  postgres-staging:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xsusu_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
      POSTGRES_DB: xsusu_staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - xsusu-staging

  # Production Redis
  redis-prod:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    ports:
      - "6379:6379"
    networks:
      - xsusu-prod

  # Staging Redis
  redis-staging:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${STAGING_REDIS_PASSWORD}
    volumes:
      - redis_staging_data:/data
    ports:
      - "6380:6379"
    networks:
      - xsusu-staging

  # Staging API Server
  api-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://xsusu_staging:${STAGING_DB_PASSWORD}@postgres-staging:5432/xsusu_staging
      REDIS_URL: redis://:${STAGING_REDIS_PASSWORD}@redis-staging:6379
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      - postgres-staging
      - redis-staging
    networks:
      - xsusu-staging

  # Production API Server
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://xsusu_prod:${PROD_DB_PASSWORD}@postgres-prod:5432/xsusu
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-prod:6379
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres-prod
      - redis-prod
    networks:
      - xsusu-prod
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  postgres_prod_data:
  postgres_staging_data:
  redis_prod_data:
  redis_staging_data:

networks:
  xsusu-prod:
  xsusu-staging: